<nav class="site-nav" aria-label="Main">
  <div class="nav-inner">
    <a class="nav-brand" href="{{ "/" | relURL }}">{{ site.Params.author }}</a>
    <ul class="nav-links">
      {{- range site.Menus.main }}
      {{- $external := or (strings.HasPrefix .URL "http") (strings.HasSuffix .URL ".pdf") }}
      <li><a href="{{ .URL | relURL }}"{{ if $external }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </div>
</nav>
